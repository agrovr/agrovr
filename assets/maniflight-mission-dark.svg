<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="maniflight-title maniflight-desc">
  <title id="maniflight-title">Maniflight PR flight director</title>
  <desc id="maniflight-desc">A deep-space flight path showing the Maniflight workflow: a pull request enters a read-only evidence scan that separates observed blockers from evidence gaps, and both routes converge on the next actor.</desc>
  <defs>
    <pattern id="chart-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#aa8dcb" stroke-width="0.65" opacity="0.1"/>
    </pattern>
    <radialGradient id="violet-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67408f" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#67408f" stop-opacity="0"/>
    </radialGradient>
    <marker id="route-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5 1 9Z" fill="#f2a45b"/>
    </marker>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
  </defs>

  <rect width="920" height="350" fill="#0d0816"/>
  <rect width="920" height="350" fill="url(#chart-grid)"/>
  <ellipse cx="330" cy="206" rx="220" ry="126" fill="url(#violet-haze)" filter="url(#blur)"/>
  <path d="M16 40V16h24M880 16h24v24M904 310v24h-24M40 334H16v-24" fill="none" stroke="#b89adb" stroke-width="1.3" opacity="0.58"/>

  <text x="42" y="48" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="760" letter-spacing="-0.4" fill="#f4eefb">MANIFLIGHT / PR FLIGHT DIRECTOR</text>
  <text x="43" y="76" font-family="Georgia, Times New Roman, serif" font-size="17" font-style="italic" fill="#c2a5e8">why a pull request is grounded, and who clears it for launch</text>
  <text x="878" y="48" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#a992c4">MISSION 01</text>

  <path d="M105 206C170 206 225 192 300 196" fill="none" stroke="#a98bca" stroke-width="8" opacity="0.18"/>
  <path d="M105 206C170 206 225 192 300 196" fill="none" stroke="#f2a45b" stroke-width="2.4"/>
  <path d="M105 206C170 206 225 192 300 196" fill="none" stroke="#c0a3e0" stroke-width="1" stroke-dasharray="2 10" opacity="0.74"/>
  <path d="M346 184C404 160 436 136 494 136" fill="none" stroke="#a98bca" stroke-width="8" opacity="0.18"/>
  <path d="M346 184C404 160 436 136 494 136" fill="none" stroke="#f2a45b" stroke-width="2.4"/>
  <path d="M346 184C404 160 436 136 494 136" fill="none" stroke="#c0a3e0" stroke-width="1" stroke-dasharray="2 10" opacity="0.74"/>
  <path d="M346 210C404 236 436 262 494 262" fill="none" stroke="#a98bca" stroke-width="8" opacity="0.18"/>
  <path d="M346 210C404 236 436 262 494 262" fill="none" stroke="#c0a3e0" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>
  <path d="M554 152C610 176 672 190 752 194" fill="none" stroke="#a98bca" stroke-width="8" opacity="0.18"/>
  <path d="M554 152C610 176 672 190 752 194" fill="none" stroke="#f2a45b" stroke-width="2.4" marker-end="url(#route-arrow)"/>
  <path d="M554 152C610 176 672 190 752 194" fill="none" stroke="#c0a3e0" stroke-width="1" stroke-dasharray="2 10" opacity="0.74"/>
  <path d="M554 246C610 222 672 210 752 206" fill="none" stroke="#a98bca" stroke-width="8" opacity="0.18"/>
  <path d="M554 246C610 222 672 210 752 206" fill="none" stroke="#c0a3e0" stroke-width="2" stroke-dasharray="6 7" stroke-linecap="round"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#f3edf9">
    <g transform="translate(105 206)">
      <circle r="39" fill="#151020" stroke="#b491d8" stroke-width="1.8"/>
      <circle r="51" fill="none" stroke="#9472b8" stroke-width="1" stroke-dasharray="2 6" opacity="0.62"/>
      <circle cx="-9" cy="-14" r="5" fill="none" stroke="#d0bee4" stroke-width="2.2"/>
      <circle cx="-9" cy="15" r="5" fill="none" stroke="#d0bee4" stroke-width="2.2"/>
      <circle cx="11" cy="15" r="5" fill="none" stroke="#f2a45b" stroke-width="2.2"/>
      <path d="M-9-9V10M11 10V-6c0-5-3-8-8-8H-1" fill="none" stroke="#d0bee4" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M3-19-2-14 3-9" fill="none" stroke="#f2a45b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="77" text-anchor="middle" font-size="20" font-weight="720">PULL REQUEST</text>
      <text x="0" y="97" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#ad99c5">INTAKE</text>
    </g>

    <g transform="translate(300 196)">
      <circle r="47" fill="#744fa0" stroke="#b98ddd" stroke-width="2"/>
      <circle r="59" fill="none" stroke="#9472b8" stroke-width="1" stroke-dasharray="3 7"/>
      <circle r="24" fill="none" stroke="#fff8ee" stroke-width="1.4" opacity="0.5"/>
      <circle r="13" fill="none" stroke="#fff8ee" stroke-width="1.4" opacity="0.75"/>
      <path d="M0 0 20-13" stroke="#f2a45b" stroke-width="2.6" stroke-linecap="round"/>
      <circle r="4.5" fill="#fff8ee"/>
      <circle cx="-11" cy="15" r="2.6" fill="#f2a45b"/>
      <text x="0" y="87" text-anchor="middle" font-size="20" font-weight="720">EVIDENCE SCAN</text>
      <text x="0" y="107" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#ad99c5">READ-ONLY</text>
    </g>

    <g transform="translate(524 136)">
      <circle r="30" fill="#151020" stroke="#f2a45b" stroke-width="2"/>
      <path d="M-7-15H7L15-7V7L7 15H-7L-15 7V-7Z" fill="none" stroke="#f2a45b" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M-5-5 5 5M5-5-5 5" stroke="#d0bee4" stroke-width="2.2" stroke-linecap="round"/>
      <text x="44" y="-2" text-anchor="start" font-size="20" font-weight="720">BLOCKERS</text>
      <text x="44" y="18" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#ad99c5">OBSERVED</text>
    </g>

    <g transform="translate(524 262)">
      <circle r="30" fill="#151020" stroke="#b491d8" stroke-width="1.8" stroke-dasharray="5 4"/>
      <path d="M-6-6c0-5 3-8 7-8s7 3 7 7c0 6-7 6-7 11" fill="none" stroke="#d0bee4" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="1" cy="11" r="2.3" fill="#f2a45b"/>
      <text x="44" y="4" text-anchor="start" font-size="20" font-weight="720">UNKNOWNS</text>
      <text x="44" y="24" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#ad99c5">EVIDENCE GAPS</text>
    </g>

    <g transform="translate(798 200)">
      <circle r="42" fill="#151020" stroke="#f2a45b" stroke-width="2"/>
      <circle r="54" fill="none" stroke="#9472b8" stroke-width="1" stroke-dasharray="2 6" opacity="0.62"/>
      <circle cy="-9" r="8" fill="none" stroke="#d0bee4" stroke-width="2.2"/>
      <path d="M-15 17c2-9 8-13 15-13s13 4 15 13" fill="none" stroke="#d0bee4" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M13-20 22-20M18-25 23-20 18-15" fill="none" stroke="#f2a45b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="82" text-anchor="middle" font-size="20" font-weight="720">NEXT ACTOR</text>
      <text x="0" y="102" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" fill="#ad99c5">DISPATCH</text>
    </g>
  </g>

  <g fill="#cfbae7" opacity="0.88">
    <circle cx="864" cy="98" r="1.8"/><circle cx="884" cy="121" r="2.3"/><circle cx="690" cy="104" r="1.7"/><circle cx="714" cy="88" r="2.1"/>
    <path d="M864 98l20 23M690 104l24-16" stroke="#cfbae7" stroke-width="1"/>
  </g>
</svg>
